<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="HOOK AND FORK">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b1e"/>
      <stop offset="50%" stop-color="#12122a"/>
      <stop offset="100%" stop-color="#0a0a16"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="0.12" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#e94560" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.88" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#4d8dff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#4d8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hook" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="100%" stop-color="#e94560"/>
    </linearGradient>
    <linearGradient id="fork" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4d8dff"/>
      <stop offset="100%" stop-color="#2b6cf0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glowRed)"/>
  <rect width="1200" height="300" fill="url(#glowBlue)"/>

  <g fill="#ffffff" opacity="0.5">
    <circle cx="120" cy="60" r="1.6"/>
    <circle cx="310" cy="42" r="1"/>
    <circle cx="880" cy="50" r="1.2"/>
    <circle cx="1055" cy="232" r="1.4"/>
    <circle cx="210" cy="242" r="1"/>
    <circle cx="985" cy="92" r="1"/>
    <circle cx="600" cy="38" r="1.2"/>
    <circle cx="430" cy="262" r="1"/>
    <circle cx="760" cy="255" r="1"/>
  </g>

  <!-- 左侧：钩锁 -->
  <g stroke="url(#hook)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 150 C 118 78, 200 78, 222 150 C 238 202, 200 238, 163 221" stroke-width="7"/>
    <path d="M163 221 L 147 237" stroke-width="7"/>
  </g>

  <!-- 右侧：钢叉 -->
  <g stroke="url(#fork)" fill="none" stroke-linecap="round">
    <line x1="1122" y1="150" x2="1008" y2="150" stroke-width="7"/>
    <line x1="1008" y1="150" x2="958" y2="108" stroke-width="7"/>
    <line x1="1008" y1="150" x2="946" y2="150" stroke-width="7"/>
    <line x1="1008" y1="150" x2="958" y2="192" stroke-width="7"/>
  </g>

  <!-- 标题 -->
  <text x="600" y="146" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="2">
    <tspan fill="#e94560">HOOK</tspan>
    <tspan fill="#8a8aa0" font-size="42"> AND </tspan>
    <tspan fill="#4d8dff">FORK</tspan>
  </text>
  <text x="600" y="196" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#9aa0b5" letter-spacing="6">2D · 本地双人 · 零依赖 · HTML5 CANVAS</text>

  <line x1="380" y1="222" x2="820" y2="222" stroke="#2a2a44" stroke-width="2"/>
</svg>
